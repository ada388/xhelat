<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Xhelat - Tic Tac Toe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
      color: #e94560;
    }

    .status {
      font-size: 22px;
      margin-bottom: 20px;
      height: 30px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
    }

    .cell {
      background: #1a1a2e;
      border: 2px solid #e94560;
      border-radius: 10px;
      font-size: 48px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell:hover {
      background: #16213e;
    }

    .cell.x {
      color: #e94560;
    }

    .cell.o {
      color: #0f3460;
    }

    .restart {
      margin-top: 25px;
      padding: 12px 30px;
      font-size: 18px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .restart:hover {
      background: #ff6b81;
    }
  </style>
</head>
<body>

  <h1>Xhelat (Tic Tac Toe)</h1>
  <div class="status" id="status">Radha e: X</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button class="restart" onclick="restartGame()">Rifillo Lojën</button>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    let currentPlayer = "X";
    let board = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    const winConditions = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    cells.forEach(cell => {
      cell.addEventListener("click", handleClick);
    });

    function handleClick(e) {
      const index = e.target.dataset.index;

      if (board[index] !== "" || !gameActive) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add(currentPlayer.toLowerCase());

      if (checkWinner()) {
        statusText.textContent = `Fituesi është: ${currentPlayer}!`;
        gameActive = false;
        return;
      }

      if (board.every(cell => cell !== "")) {
        statusText.textContent = "Barazim!";
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusText.textContent = `Radha e: ${currentPlayer}`;
    }

    function checkWinner() {
      return winConditions.some(condition => {
        const [a, b, c] = condition;
        return board[a] && board[a] === board[b] && board[a] === board[c];
      });
    }

    function restartGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      gameActive = true;
      currentPlayer = "X";
      statusText.textContent = "Radha e: X";
      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove("x", "o");
      });
    }
  </script>

</body>
</html>
